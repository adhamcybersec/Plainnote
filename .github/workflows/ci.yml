# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is fully trusted-input only:
#   - matrix.os values are constants defined in this file
#   - no github.event.* fields are interpolated into run: scripts
#   - all run: commands operate on checked-out source tree
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SPDX tree scan
        run: bash tools/git-hooks/check-spdx-tree.sh

  rust:
    name: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Bumped after a runner image rotation invalidated the cached
          # target/ on ubuntu-22.04 (clippy failed with "can't find
          # crate for `tauri`" because cached .rlib files were
          # rustc-version-mismatched). Bump this prefix again if a
          # similar incompatibility ever resurfaces.
          prefix-key: 'v1-rust'

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: install cargo-deny + cargo-audit
        if: matrix.os == 'ubuntu-24.04'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny check
        if: matrix.os == 'ubuntu-24.04'
        run: cargo deny check

      - name: cargo audit
        if: matrix.os == 'ubuntu-24.04'
        run: cargo audit

      - name: forbid `use tauri` in core/
        run: |
          if grep -rnE '^[[:space:]]*use[[:space:]]+tauri' src/core/; then
            echo "::error::core/ may not import from tauri::*"
            exit 1
          fi

      - name: forbid format!() SQL string-building
        run: |
          if grep -RnE 'rusqlite::.*\.execute\(\s*&?format!' src/ 2>/dev/null; then
            echo "::error::SQL must use parameterized queries, not format!()"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - name: npm audit (production deps, fail on moderate+)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (dev deps, informational only)
        run: npm audit --audit-level=moderate || true
      - run: npm run check
      - run: npm run test
      - run: npm run build
