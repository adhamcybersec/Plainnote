# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Release workflow — builds AppImage + .deb on tag push, uploads both to a
# GitHub Release alongside SHA256SUMS.
#
# Trigger: push a tag matching v*.*.* (e.g. v0.1.0, v0.1.1, v1.0.0-rc.1).
# Manual dispatch is also wired so a maintainer can re-run a release
# without re-tagging.
#
# Trusted-input policy (matches ci.yml):
#   - All `${{ github.* }}` and `${{ inputs.* }}` values flow through `env:`
#     blocks and are referenced as $VAR in shells. We never interpolate
#     user-controlled strings directly into `run:` commands.
#   - The git tag is constrained by the `tags:` filter to v*.*.*; the
#     "Resolve version" step still validates the result with a regex
#     before any side-effecting step runs.
#   - Third-party actions are pinned by full SHA, not floating tags.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write   # needed to create the GitHub Release + upload assets

jobs:
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-22.04
    env:
      REF_NAME: ${{ github.ref_name }}
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            # Strip the leading 'v' from the tag name (e.g. v0.1.0 → 0.1.0).
            VERSION="${REF_NAME#v}"
          fi
          # Validate semver-ish: digits.dot.digits.dot.digits with optional pre-release.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "::error::version '$VERSION' is not semver" && exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Plainnote v$VERSION"

      - name: Stamp version into tauri.conf.json + Cargo.toml + package.json
        run: |
          set -euo pipefail
          # tauri.conf.json — top-level "version" field.
          python3 - <<'PY'
          import json, os
          v = os.environ['VERSION']
          for path in (
              'apps/desktop/src-tauri/tauri.conf.json',
              'apps/desktop/package.json',
          ):
              with open(path) as f:
                  data = json.load(f)
              data['version'] = v
              with open(path, 'w') as f:
                  json.dump(data, f, indent=2)
                  f.write('\n')
          PY
          # Cargo.toml — package.version (sed only, no formatting churn).
          sed -i "s/^version = \"0\\.1\\.0-dev\"$/version = \"${VERSION}\"/" \
            apps/desktop/src-tauri/Cargo.toml

      - name: Install system dependencies (Ubuntu 22.04)
        run: |
          set -euo pipefail
          sudo apt-get update
          # FUSE landscape on this runner:
          # - 'fuse3' is PRE-INSTALLED on ubuntu-22.04 GH runners. It
          #   declares Breaks: fuse, so apt CANNOT install fuse alongside
          #   it. Adding 'fuse' to this list gets apt to silently evict
          #   fuse3 — which then breaks flatpak-builder's rofiles-fuse
          #   (calls fusermount3). Don't list 'fuse'.
          # - 'libfuse2' (the runtime library) is what AppImage end-users
          #   need. We list it here so the AppImage Tauri produces is
          #   self-contained for any system that already has libfuse2.
          # - APPIMAGE_EXTRACT_AND_RUN=1 (set on the tauri build step
          #   below) tells appimagetool to extract instead of FUSE-mount,
          #   so the build itself doesn't need fusermount (2.x binary).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            fuse3 \
            flatpak \
            flatpak-builder

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17  # 1.78
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install npm deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build Tauri bundles (AppImage + .deb)
        working-directory: apps/desktop
        # APPIMAGE_EXTRACT_AND_RUN tells appimagetool to extract its own
        # contents instead of FUSE-mounting them. Required on runners
        # without 'fuse' (FUSE 2.x) — see apt-install step above.
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --bundles appimage,deb

      # ─── Flatpak build ───────────────────────────────────────────────
      # We don't re-build Rust inside the Flatpak sandbox; we extract the
      # .deb produced above and repackage it into the FreeDesktop 24.08
      # runtime. Build time: ~3-5 min once the runtime is cached.

      - name: Cache Flatpak runtime (GNOME 47)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-gnome-47-v1
          restore-keys: flatpak-runtime-gnome-47-

      - name: Add Flathub + install runtime/sdk
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          # GNOME Platform 47 includes libwebkit2gtk-4.1, which Tauri 2
          # links against. The freedesktop platform doesn't ship webkit.
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//47 \
            org.gnome.Sdk//47

      - name: Stage .deb for Flatpak build
        run: |
          set -euo pipefail
          # The manifest references './plainnote.deb' (relative to manifest).
          # There's exactly one .deb in the bundle dir; glob and rename.
          find apps/desktop/src-tauri/target/release/bundle/deb \
            -name '*.deb' -print -exec cp {} packaging/flatpak/plainnote.deb \;

      - name: Build Flatpak bundle
        working-directory: packaging/flatpak
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean \
            --repo=repo \
            --install-deps-from=flathub \
            build-dir dev.plainnote.app.yml
          # Bundle the per-user OSTree repo into a single .flatpak file.
          mkdir -p ../../release-out
          flatpak build-bundle repo \
            "../../release-out/Plainnote-${VERSION}-x86_64.flatpak" \
            dev.plainnote.app

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release-out
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage release-out/
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb release-out/
          # The .flatpak was already placed in release-out/ by the build
          # step above; just confirm it's there.
          ls -la release-out/
          test -f release-out/Plainnote-${VERSION}-x86_64.flatpak

      - name: Generate SHA256SUMS
        working-directory: release-out
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: plainnote-linux-${{ env.VERSION }}
          path: release-out/
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release (tag push only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: create draft release if missing, then upload + clobber.
          # GitHub auto-generates release notes from PRs/commits when the
          # --generate-notes flag is passed.
          if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release create "$REF_NAME" \
              --title "Plainnote $REF_NAME" \
              --generate-notes \
              --draft
          fi
          gh release upload "$REF_NAME" release-out/* --clobber
