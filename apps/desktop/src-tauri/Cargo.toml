# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "plainnote"
version = "0.1.0-dev"
description = "Plainnote — a local-first note-taking app"
authors = ["Plainnote contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.78"

[lib]
name = "plainnote_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
# proptest, tempfile, etc. land in M1a

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
