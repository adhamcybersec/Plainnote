# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "plainnote"
version = "0.1.0-dev"
description = "Plainnote — a local-first note-taking app"
authors = ["Plainnote contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.78"

[lib]
name = "plainnote_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
notify-rust = { version = "4", default-features = false, features = ["d"] }

# M4 voice/STT — see docs/plans/2026-05-07-v0.2-release.md
zeroize = { version = "=1.8.1", features = ["derive"] }
# voice capture (M4-T2). Pinned exact: spike (ADR-010) found cpal's API
# changed between 0.15 and 0.17, and we depend on the 0.17 build_input_stream
# signature with the `Option<Duration>` timeout argument.
cpal = "=0.17.3"
# whisper.cpp Rust binding (M4-T4). Pinned exact per ADR-010: spike confirmed
# 0.16.0 builds and runs the bundled ggml-base.en model on CPU; minor versions
# of whisper-rs have historically broken FullParams/SamplingStrategy APIs.
whisper-rs = "=0.16.0"

[features]
# Enables tests that load a real whisper model file from disk. Off by default
# in CI because no model is bundled; the gated test reads its model path from
# `PLAINNOTE_TEST_MODEL_PATH` (or falls back to ~/Downloads/ggml-base.en.bin)
# and skips with a message if the file is absent. See core::stt tests.
whisper-integration = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Used by the gated `whisper-integration` test to resolve ~/Downloads.
# dirs is dev-only here; M4-T5 will promote it to a regular [dependencies]
# entry for runtime XDG model-path resolution. When that lands, remove
# this dev-deps entry to avoid a duplicate listing.
dirs = "6"

[[bench]]
name = "tag_query"
harness = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
