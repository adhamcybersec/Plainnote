# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "plainnote"
version = "0.1.0-dev"
description = "Plainnote — a local-first note-taking app"
authors = ["Plainnote contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.78"

[lib]
name = "plainnote_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
